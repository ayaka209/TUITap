[workspace]
resolver = "2"
members = [
    "tuitap-core",
    "tuitap-gateway",
    "tuitap-push",
    "tuitap-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ayaka209/TUITap"

[workspace.dependencies]
tokio      = { version = "1", features = ["full"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror  = "2"
async-trait = "0.1"
tracing    = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid       = { version = "1", features = ["v4"] }
regex      = "1"
